[project]
name = "agent-lab"
version = "0.1.0"
description = "OpenMoney Agent Lab: the same agent task on every framework, measured from the outside."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "mcp>=1.10",
  "pydantic>=2.7",
  "pyyaml>=6",
  "anthropic>=0.60",
  "sse-starlette>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
agent-lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]
